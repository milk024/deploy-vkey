# AppProject vkey — deploy-vkey 만 읽고, vkey-system 네임스페이스에만 배포. 클러스터 범위 리소스는 허용하지 않음
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: vkey
  namespace: argocd
spec:
  description: vkey-system 네임스페이스 (vkey-server, vkey-web)
  sourceRepos:
    # 2026-11-17 https 주소로 전환 (Gitea push 웹훅 주소와 같아야 ArgoCD 가 즉시 새로고침). 예전 ssh 주소·배포 키는 같은 날 정리
    - https://gpu.example.ac.kr/gitea/myorg/deploy-vkey.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: vkey-system
  clusterResourceWhitelist: []
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
